# 의존성 버전(2026-10-23 Maven Central 최신 안정판). 바꾸면 Spring Boot 관리 버전과의 호환을 다시 확인한다(ADR-0005).
[versions]
grpc = "1.85.1"
protobuf = "4.36.2"
# grpc-netty 1.85.1이 쓰는 Netty 버전과 맞춘다(PoC의 native epoll 경로용).
netty = "4.2.17.Final"
junit = "6.1.3"
testcontainers = "2.0.5"
gson = "2.14.0"
# bench 전용(제품 의존성 아님). Phase 4 비교 대상과 측정 도구.
jmh = "1.37"
twelvemonkeys = "3.15.3"
darkxanter-webp = "0.3.3"
chicory = "1.7.5"

[libraries]
grpc-netty = { module = "io.grpc:grpc-netty", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-services = { module = "io.grpc:grpc-services", version.ref = "grpc" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
netty-epoll = { module = "io.netty:netty-transport-native-epoll", version.ref = "netty" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
twelvemonkeys-webp = { module = "com.twelvemonkeys.imageio:imageio-webp", version.ref = "twelvemonkeys" }
darkxanter-webp = { module = "io.github.darkxanter:webp-imageio", version.ref = "darkxanter-webp" }
chicory-runtime = { module = "com.dylibso.chicory:runtime", version.ref = "chicory" }
chicory-wasm = { module = "com.dylibso.chicory:wasm", version.ref = "chicory" }
chicory-compiler = { module = "com.dylibso.chicory:compiler", version.ref = "chicory" }
chicory-compiler-cli = { module = "com.dylibso.chicory:build-time-compiler-cli-experimental", version.ref = "chicory" }

[plugins]
protobuf = { id = "com.google.protobuf", version = "0.10.0" }
