# webp-imageio-server 사이드카 예시(ADR-0012). 저장소 루트에서: docker compose -f deploy/compose.yaml up --build
# 이 파일은 docker compose로 실행해 검증하지 않았다(작성 환경에 compose 플러그인이 없었다). 같은 격리 옵션의
# docker run 명령은 deploy/README.md에 있고 그쪽은 검증했다.
#
# 클라이언트 컨테이너는 같은 볼륨을 /run/webp-imageio에 마운트하고 그룹 65532를 추가한다:
#   volumes: ["webp-socket:/run/webp-imageio"]
#   group_add: ["65532"]
services:
  webp-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: webp-imageio-server:dev
    network_mode: none
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    # seccomp 경로는 compose 파일 기준이다(미검증, 위 머리 주석 참고).
    security_opt: ["no-new-privileges:true", "seccomp:./seccomp/webp-imageio-server.json"]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 128
    environment:
      RUST_LOG: info
    volumes:
      - webp-socket:/run/webp-imageio
    restart: unless-stopped

volumes:
  webp-socket: {}
